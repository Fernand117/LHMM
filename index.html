<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f3" />
    <meta name="description" content="Un atlas interactivo para explorar la historia de México. Descubre acontecimientos, personajes y conexiones, con fuentes y contexto." />
    <title>LHMM — La Historia del México Moderno</title>
    <script>
      // Apply the stored/system theme before the first paint and before React loads.
      (() => {
        let preference = 'system'
        try {
          const stored = localStorage.getItem('lhmm-theme-v1')
          if (stored === 'light' || stored === 'dark') preference = stored
        } catch {}
        const theme = preference === 'system'
          ? matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#151c18' : '#f7f8f3'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
